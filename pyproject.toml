[project]
name = "seedkey"
version = "0.1.0"
description = "Score AI code review output (CodeRabbit first) against an answer key of seeded bugs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devesh B" }]
dependencies = []

[project.scripts]
seedkey = "seedkey.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
